name = "stellar"
kind = "desktop"
track = "native-desktop"
runtime = "compatibility-shell"
source_root = "app-blueprint"
truth = "file-first"
native_ir = "app-blueprint/app.ir.yaml"
desktop_targets = ["macos", "linux"]
mobile_workspace = "stellar-mobile"
license = "OWL-3.1"

[core]
binary = "scripts/stellar-backend.sh"
role = "mail-and-secure-chat-control-plane"
state = "mail-root-file-first"

[wizardry]
role = "render-validate-release"
compatibility_backend = "scripts/stellar-backend.sh"
desktop_render = "scripts/render-native-desktop.sh"
desktop_validate = "scripts/validate-native-desktop-ir.sh"
