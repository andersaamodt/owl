name: Native Release Builds

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_play:
        description: "Upload the signed Android release bundle to Google Play internal draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Native Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run native contract tests
        run: sh .tests/native/run.sh
      - name: Test bundled mail engine
        run: |
          CARGO_TARGET_DIR="$HOME/.local/state/stellar/mail-engine/cargo-target" \
            cargo test --manifest-path mail-engine/Cargo.toml --locked

  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install jq
      - name: Generate desktop targets
        run: sh scripts/render-native-desktop.sh
      - name: Build bundled mail engine
        run: |
          CARGO_TARGET_DIR="$HOME/.local/state/stellar/mail-engine/cargo-target" \
            cargo build --manifest-path mail-engine/Cargo.toml --release --locked --bins
      - name: Build release executable
        run: |
          set -eu
          cd "$HOME/.local/state/stellar/generated/macos"
          swift build -c release
      - name: Package app bundle
        run: |
          set -eu
          app_dir="dist/Stellar.app"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources/scripts" "$app_dir/Contents/Resources/libexec/stellar-mail"
          cp "$HOME/.local/state/stellar/generated/macos/.build/release/stellar" "$app_dir/Contents/MacOS/Stellar"
          cp scripts/stellar-backend.sh "$app_dir/Contents/Resources/scripts/"
          cp scripts/stellar-mail-backend.sh "$app_dir/Contents/Resources/scripts/"
          cp scripts/stellar-simplex-local-hook.sh "$app_dir/Contents/Resources/scripts/"
          cp scripts/stellar-secure-chat-hook.sh "$app_dir/Contents/Resources/scripts/"
          cp "$HOME/.local/state/stellar/mail-engine/cargo-target/release/owl" "$app_dir/Contents/Resources/libexec/stellar-mail/"
          cp "$HOME/.local/state/stellar/mail-engine/cargo-target/release/owl-daemon" "$app_dir/Contents/Resources/libexec/stellar-mail/"
          cp -R mail-engine "$app_dir/Contents/Resources/mail-engine"
          chmod +x "$app_dir/Contents/MacOS/Stellar" "$app_dir"/Contents/Resources/scripts/*.sh
          cat >"$app_dir/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Stellar</string>
            <key>CFBundleIdentifier</key>
            <string>app.wizardry.stellar</string>
            <key>CFBundleName</key>
            <string>Stellar</string>
            <key>CFBundleDisplayName</key>
            <string>Stellar</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_dir" dist/Stellar-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Stellar-macOS
          path: dist/Stellar-macOS.zip

  linux:
    name: Linux GTK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y jq build-essential pkg-config meson ninja-build libgtk-4-dev
      - name: Generate desktop targets
        run: sh scripts/render-native-desktop.sh
      - name: Build bundled mail engine
        run: |
          CARGO_TARGET_DIR="$HOME/.local/state/stellar/mail-engine/cargo-target" \
            cargo build --manifest-path mail-engine/Cargo.toml --release --locked --bins
      - name: Build Linux executable
        run: |
          set -eu
          generated_root="$HOME/.local/state/stellar/generated/linux"
          meson setup "$generated_root/build" "$generated_root" --buildtype=release
          meson compile -C "$generated_root/build"
      - name: Package Linux bundle
        run: |
          set -eu
          bundle="dist/stellar-linux-x86_64"
          mkdir -p "$bundle/scripts" "$bundle/libexec/stellar-mail"
          cp "$HOME/.local/state/stellar/generated/linux/build/stellar" "$bundle/stellar"
          cp scripts/stellar-backend.sh "$bundle/scripts/"
          cp scripts/stellar-mail-backend.sh "$bundle/scripts/"
          cp scripts/stellar-simplex-local-hook.sh "$bundle/scripts/"
          cp scripts/stellar-secure-chat-hook.sh "$bundle/scripts/"
          cp "$HOME/.local/state/stellar/mail-engine/cargo-target/release/owl" "$bundle/libexec/stellar-mail/"
          cp "$HOME/.local/state/stellar/mail-engine/cargo-target/release/owl-daemon" "$bundle/libexec/stellar-mail/"
          cp -R mail-engine "$bundle/mail-engine"
          chmod +x "$bundle/stellar" "$bundle"/scripts/*.sh
          tar -czf dist/stellar-linux-x86_64.tar.gz -C dist stellar-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-linux-x86_64
          path: dist/stellar-linux-x86_64.tar.gz

  android:
    name: Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate mobile targets
        working-directory: stellar-mobile
        run: sh scripts/render-native-mobile.sh
      - name: Build APK and release bundle
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          cd "$HOME/.local/state/stellar-mobile/generated/mobile/android"
          gradle --no-daemon assembleDebug bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/stellar-android-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/stellar-android-release.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-android-debug-apk
          path: dist/stellar-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-android-release-aab
          path: dist/stellar-android-release.aab

  play-upload:
    name: Google Play Draft Upload
    runs-on: ubuntu-latest
    needs: android
    if: github.event_name == 'workflow_dispatch' && inputs.upload_play
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stellar-android-release-aab
          path: play
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.wizardry.stellar
          releaseFiles: play/app-release.aab
          track: internal
          status: draft

  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install jq xcodegen
      - name: Generate mobile targets
        working-directory: stellar-mobile
        run: sh scripts/render-native-mobile.sh
      - name: Generate Xcode project
        run: |
          set -eu
          cd "$HOME/.local/state/stellar-mobile/generated/mobile/ios"
          xcodegen generate --spec project.yml
      - name: Validate Xcode project
        run: |
          set -eu
          cd "$HOME/.local/state/stellar-mobile/generated/mobile/ios"
          xcodebuild -list -project stellar-mobile.xcodeproj
      - name: Build unsigned simulator app
        run: |
          set -eu
          cd "$HOME/.local/state/stellar-mobile/generated/mobile/ios"
          xcodebuild \
            -project stellar-mobile.xcodeproj \
            -scheme stellar \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package generated iOS project
        run: |
          set -eu
          cd "$HOME/.local/state/stellar-mobile/generated/mobile/ios"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent stellar-mobile.xcodeproj "$GITHUB_WORKSPACE/dist/stellar-ios-project.zip"
          app_path=$(find build/DerivedData/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name '*.app' | head -n 1)
          [ -n "$app_path" ]
          ditto -c -k --keepParent "$app_path" "$GITHUB_WORKSPACE/dist/stellar-ios-simulator-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-ios-project
          path: dist/stellar-ios-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-ios-simulator-app
          path: dist/stellar-ios-simulator-app.zip

  github-release:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - macos
      - linux
      - android
      - ios
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --generate-notes --title "$TAG_NAME"
          find release-artifacts -type f -print -exec gh release upload "$TAG_NAME" {} --clobber \;
